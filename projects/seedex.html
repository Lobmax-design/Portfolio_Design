<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seedex | Naveen R Portfolio</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="projects.css" />
</head>
<body class="project-page">

  <!-- Custom Cursor -->
  <div class="custom-cursor">
    <div class="cursor-dot"></div>
    <div class="cursor-text"></div>
  </div>

  <!-- Texture Overlay -->
  <div class="texture-overlay" aria-hidden="true"></div>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="Fullscreen view">
  </div>

  <!-- Main Scrollable Panel Container (Base matching Hero page .panel-inner) -->
  <div class="panel-inner project-panel-inner">

    <!-- Header -->
    <header class="project-header">
      <h1 class="project-page-title">SEEDEX</h1>
      <div class="project-subtitle">
        <span><span class="arrow">▸</span> SEEDEX</span>
        <span class="project-details">I designed targeted social media posters for Seedex, a regional solar energy company. These promotional graphics were crafted mostly in Malayalam to maximize local audience engagement and brand awareness.</span>
      </div>
    </header>

    <!-- Gallery Layout (3x3 Grid) -->
    <main class="project-gallery-container">
      <div class="layout-grid-3x3">
        
        <img src="../assets/Malayalm Posters/apr 1.png" alt="Seedex Poster 1" data-cursor-text="VIEW FULL" />
        <img src="../assets/Malayalm Posters/apr 2.png" alt="Seedex Poster 2" data-cursor-text="VIEW FULL" />
        <img src="../assets/Malayalm Posters/apr 3.png" alt="Seedex Poster 3" data-cursor-text="VIEW FULL" />
        <img src="../assets/Malayalm Posters/mar -4.png" alt="Seedex Poster 4" data-cursor-text="VIEW FULL" />
        <img src="../assets/Malayalm Posters/mar -5.1.png" alt="Seedex Poster 5" data-cursor-text="VIEW FULL" />
        <img src="../assets/Malayalm Posters/work 13.png" alt="Seedex Poster 6" data-cursor-text="VIEW FULL" />
        <img src="../assets/Malayalm Posters/work 15.png" alt="Seedex Poster 7" data-cursor-text="VIEW FULL" />
        <img src="../assets/Malayalm Posters/work 2.png" alt="Seedex Poster 8" data-cursor-text="VIEW FULL" />
        <img src="../assets/Malayalm Posters/work 9.2.png" alt="Seedex Poster 9" data-cursor-text="VIEW FULL" />

      </div>
    </main>

    <!-- SHALL WE WORK ! Section -->
    <section class="shall-we-work-section">
      <div class="shall-we-work-card">
        <h2 class="shall-we-work-title">SHALL WE<br>WORK !</h2>
        <div class="shall-we-work-content">
          <p class="shall-we-work-subtext">FEEL FREE TO EMAIL ME.</p>
          <p class="shall-we-work-email">
            <a href="mailto:lobmax01@gmail.com" class="shall-we-work-email-link" data-cursor-text="EMAIL">lobmax01@gmail.com</a>
          </p>
        </div>
        <div class="shall-we-work-nav">
          <a href="../index.html#panel-home" class="shall-we-work-link" data-cursor-text="HOME">HOME</a>
          <a href="../index.html#contacts-section" class="shall-we-work-link" data-cursor-text="ABOUT">ABOUT</a>
        </div>
      </div>
    </section>

  </div><!-- /panel-inner -->

  <script type="module" src="../main.js"></script>
</body>
</html>
