<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invento'26 | Naveen R Portfolio</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="projects.css" />
</head>

<body class="project-page">

  <!-- Custom Cursor -->
  <div class="custom-cursor">
    <div class="cursor-dot"></div>
    <div class="cursor-text"></div>
  </div>



  <!-- Texture Overlay -->
  <div class="texture-overlay" aria-hidden="true"></div>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="Fullscreen view">
  </div>

  <!-- Main Scrollable Panel Container (Base matching Hero page .panel-inner) -->
  <div class="panel-inner project-panel-inner">

    <!-- Header -->
    <header class="project-header">
      <h1 class="project-page-title">INVENTO'26</h1>
      <div class="project-subtitle">
        <span><span class="arrow">▸</span> INVENTO</span>
        <span class="project-details">Serving as the Design Lead for this prominent technical fest, I directed the complete visual identity, crafting impactful brochures, custom ID cards, banners, and dynamic social media posters.
      </div>
    </header>

    <!-- Gallery Layout for Invento'26 (1-2-1-2 Order) -->
    <main class="project-gallery-container">
      <div class="layout-1-2-1">

        <!-- 1 - T-Shirt Design (Full Width) -->
        <div class="layout-row-1">
          <img src="../assets/Invento/Tshirt mockup.jpg" alt="Invento T-Shirt Design Mockup"
            data-cursor-text="T-SHIRT DESIGN" />
        </div>

        <!-- 2 - Banner & ID Card (Side-by-Side) -->
        <div class="layout-row-2">
          <div>
            <img src="../assets/Invento/Banner mockup.jpg" alt="Invento Banner Mockup"
              data-cursor-text="BANNER DESIGN" />
          </div>
          <div>
            <img src="../assets/Invento/ID card mockups.jpg" alt="Invento ID Card Mockup"
              data-cursor-text="ID CARD DESIGN" />
          </div>
        </div>

        <!-- 1 - Brochure Design (Full Width) -->
        <div class="layout-row-1">
          <img src="../assets/Invento/Mockup 2.jpg" alt="Invento Main Event Poster Mockup"
            data-cursor-text="POSTER DESIGN" />
        </div>

        <!-- 2 - Main Poster Mockup & Coupon Mockup (Side-by-Side) -->
        <div class="layout-row-2">
          <div>
            <img src="../assets/Invento/Brochure mockup.jpg" alt="Invento Brochure Mockup"
              data-cursor-text="BROCHURE DESIGN" />
          </div>
          <div>
            <img src="../assets/Invento/Coupon mockups.jpg" alt="Invento Coupon Mockup"
              data-cursor-text="COUPON DESIGN" />
          </div>
        </div>

      </div>
    </main>

    <!-- SHALL WE WORK ! Section -->
    <section class="shall-we-work-section">
      <div class="shall-we-work-card">
        <h2 class="shall-we-work-title">SHALL WE<br>WORK !</h2>
        <div class="shall-we-work-content">
          <p class="shall-we-work-subtext">FEEL FREE TO EMAIL ME.</p>
          <p class="shall-we-work-email">
            <a href="mailto:lobmax01@gmail.com" class="shall-we-work-email-link"
              data-cursor-text="COME ON LET'S WORK">lobmax01@gmail.com</a>
          </p>
        </div>
        <div class="shall-we-work-nav">
          <a href="../index.html#panel-home" class="shall-we-work-link" data-cursor-text="HOME">HOME</a>
          <a href="../index.html#contacts-section" class="shall-we-work-link" data-cursor-text="ABOUT">ABOUT</a>
        </div>
      </div>
    </section>

  </div><!-- /panel-inner -->

  <script type="module" src="../main.js"></script>
</body>

</html>
